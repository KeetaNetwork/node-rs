[package]
name = "keetanetwork-contract-std"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Keeta-specific message and query types for CosmWasm-compatible Keetanetwork contracts"

[features]
default = []
# Implement `cosmwasm_std::CustomMsg` / `CustomQuery` (cosmwasm-std 2.x, the
# version the cw-plus ecosystem builds against) and export the `requires_keeta`
# capability marker. Enable this from contracts; the host engine leaves it off.
cosmwasm = ["dep:cosmwasm-std", "dep:schemars"]

[dependencies]
serde = { workspace = true }

[dependencies.cosmwasm-std]
version = "2.2"
optional = true

# Matches cosmwasm-std 2.x, which requires `JsonSchema` on custom messages.
[dependencies.schemars]
version = "0.8"
optional = true

[dev-dependencies]
serde_json = { workspace = true }
