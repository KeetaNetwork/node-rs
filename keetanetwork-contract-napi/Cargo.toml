[package]
name = "keetanetwork-contract-napi"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Node.js bindings for the Keetanetwork contract engine, which Keeta nodes run contract calls with"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `napi4` (the default) for threadsafe functions and deferred promises.
napi = { version = "3.16", default-features = false, features = ["napi4", "dyn-symbols"] }
napi-derive = "3.7"
futures = { version = "0.3", default-features = false, features = ["executor"] }
keetanetwork-contract-engine = { workspace = true }
num-bigint = { workspace = true, features = ["std"] }
base64 = { workspace = true, features = ["std"] }
hex = { workspace = true, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["std"] }

[build-dependencies]
napi-build = "2"
