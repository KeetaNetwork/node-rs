name: Release

# Publishes to crates.io whenever a push to main changes a crate version.
# scripts/release-plan.sh compares workspace crate versions with the
# previous commit:
#   - [workspace.package].version changed -> full release + releases/v<ver> tag
#   - only crate versions changed         -> publish just those crates, no tag
#   - nothing changed                     -> skip
#
# No long-lived credentials:
#   - crates.io: Trusted Publishing. rust-lang/crates-io-auth-action trades
#     this job's GitHub OIDC token for a short-lived publish token, which it
#     revokes when the job ends. Every crate needs a Trusted Publisher entry
#     on crates.io (owner KeetaNetwork, repo node-rs, workflow release.yml,
#     environment release).
#   - Release tag: signed keyless with Sigstore gitsign, using the same OIDC
#     identity. Verify with:
#       gitsign verify \
#         --certificate-identity=https://github.com/KeetaNetwork/node-rs/.github/workflows/release.yml@refs/heads/main \
#         --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
#         releases/v<version>
#
# release.sh skips any version already on crates.io, so re-running after a
# partial failure (workflow_dispatch) resumes where it stopped.

on:
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full (publish everything unpublished + tag) or dry-run'
        type: choice
        options: [full, dry-run]
        default: full

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GITSIGN_VERSION: 0.18.0
  GITSIGN_SHA256: 2bc625472a08fea3bb6a57982c7d8b4978d1032251d305ceef3bf2ded0ca4483

jobs:
  plan:
    name: Detect version changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1

      - name: Compare crate versions with the previous commit
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODE: ${{ inputs.mode }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "mode=$DISPATCH_MODE" >> "$GITHUB_OUTPUT"
            echo "packages=" >> "$GITHUB_OUTPUT"
          else
            scripts/release-plan.sh "$BEFORE" HEAD | tee -a "$GITHUB_OUTPUT"
          fi

  release:
    name: Publish to crates.io
    needs: plan
    if: >-
      needs.plan.outputs.mode == 'dry-run' ||
      (needs.plan.outputs.mode != 'none' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest-l
    # Must match the environment on each crate's Trusted Publisher entry.
    environment: release
    permissions:
      contents: write   # push the release tag
      id-token: write   # crates.io Trusted Publishing + gitsign
      packages: read    # node harness from GitHub Packages
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      PACKAGES: ${{ needs.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@keetanetwork'

      - name: Install reference implementation harness
        run: make node-harness
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tests, lint and package verification all run before a publish token
      # exists, so the short-lived token only has to cover the uploads.
      - name: Run all tests
        run: make test-all

      - name: Lint
        run: make do-lint-ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packages (cargo publish --dry-run)
        run: |
          read -ra pkgs <<< "$PACKAGES"
          ./scripts/release.sh --dry-run --skip-tests --skip-lint --existing-only "${pkgs[@]}"

      - name: Install gitsign
        if: env.MODE == 'full'
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -sSfL -o "$bin/gitsign" \
            "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64"
          echo "${GITSIGN_SHA256}  $bin/gitsign" | sha256sum -c -
          chmod +x "$bin/gitsign"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Configure git
        if: env.MODE == 'full'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # release.sh runs `git tag -s`; route it through gitsign.
          git config gpg.format x509
          git config gpg.x509.program gitsign

      - name: Get crates.io publish token
        if: env.MODE != 'dry-run'
        id: crates-io
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish
        if: env.MODE != 'dry-run'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
          GITSIGN_TOKEN_PROVIDER: github-actions
        run: |
          read -ra pkgs <<< "$PACKAGES"
          ./scripts/release.sh --skip-tests --skip-lint --no-verify --existing-only "${pkgs[@]}"

      - name: Push release tag
        if: env.MODE == 'full'
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -1)"
          git push origin "refs/tags/releases/v${version}"
