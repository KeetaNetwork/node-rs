[package]
name = "keetanetwork-mobile"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Wallet key operations for the KeetaNet mobile native module"

[lib]
path = "src/lib.rs"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
bip39-dict = { workspace = true }
keetanetwork-account = { workspace = true, features = ["alloc", "rasn"] }
keetanetwork-bindings = { workspace = true, features = ["std"] }
keetanetwork-block = { workspace = true, features = ["alloc", "rasn"] }
keetanetwork-crypto = { workspace = true, features = ["alloc", "signature", "encryption"] }
uniffi = "0.32.2"
zeroize = { version = "1.8.1", features = ["derive"] }

[dev-dependencies]
hex = { workspace = true, features = ["alloc"] }
serde = { workspace = true }
serde_json = { workspace = true }
