[package]
name = "keetanetwork-contract-engine"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Phase 0 spike: CosmWasm-compatible contract execution engine for Keetanetwork"
publish = false

[dependencies]
# Release candidate: 3.1 accepts (and meters) bulk-memory instructions, which
# Rust has emitted by default since 1.87. Move to 3.1.0 once it is released.
cosmwasm-vm = { version = "=3.1.0-rc.1", default-features = false, features = ["iterator"] }
cosmwasm-std = { version = "=3.1.0-rc.1", default-features = false, features = ["std", "iterator", "cosmwasm_2_2"] }
keetanetwork-contract-std = { workspace = true }
keetanetwork-account = { workspace = true, features = ["std"] }
keetanetwork-block = { workspace = true, features = ["std", "rasn"] }
keetanetwork-crypto = { workspace = true, features = ["std"] }
num-bigint = { workspace = true, features = ["std"] }
hex = { workspace = true, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
snafu = { workspace = true, features = ["std"] }
tempfile = "3"

[dev-dependencies]
keetanetwork-block = { workspace = true, features = ["std", "rasn", "testing"] }
